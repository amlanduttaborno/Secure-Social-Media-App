{% extends 'base.html' %}
{% block content %}
  <section class="form-card">
    <h1>Edit Post</h1>
    <form method="post">
      <label>Title<input type="text" name="title" value="{{ title }}" required></label>
      <label>Body<textarea name="body" rows="10" required>{{ body }}</textarea></label>
      <button type="submit">Save changes</button>
    </form>
  </section>
{% endblock %}
