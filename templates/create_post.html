{% extends 'base.html' %}
{% block content %}
  <section class="form-card">
    <h1>Create Post</h1>
    <form method="post">
      <label>Title<input type="text" name="title" required></label>
      <label>Body<textarea name="body" rows="10" required></textarea></label>
      <button type="submit">Publish</button>
    </form>
  </section>
{% endblock %}
